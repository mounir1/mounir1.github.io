<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>

  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="220" stroke="url(#goldGradient)" stroke-width="4" fill="none" opacity="0.25"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="190" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.15"/>

  <!-- Calendar base -->
  <rect x="96" y="116" width="320" height="288" rx="32" ry="32" fill="#1c1917" stroke="url(#goldGradient)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Calendar header -->
  <rect x="96" y="116" width="320" height="76" rx="32" ry="32" fill="url(#goldGradient)"/>
  <rect x="96" y="172" width="320" height="20" fill="url(#goldGradient)"/>

  <!-- Calendar binding rings -->
  <circle cx="148" cy="154" r="12" fill="#1c1917"/>
  <circle cx="364" cy="154" r="12" fill="#1c1917"/>
  <circle cx="148" cy="154" r="6" fill="#fbbf24"/>
  <circle cx="364" cy="154" r="6" fill="#fbbf24"/>

  <!-- Date number "15" -->
  <text x="256" y="278" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="url(#amberGradient)" filter="url(#glow)">15</text>

  <!-- Day indicator dots -->
  <circle cx="192" cy="340" r="7" fill="#f59e0b" opacity="0.5"/>
  <circle cx="256" cy="340" r="8" fill="#fbbf24"/>
  <circle cx="320" cy="340" r="7" fill="#f59e0b" opacity="0.5"/>

  <!-- Small calendar grid hints -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.2">
    <line x1="140" y1="208" x2="372" y2="208"/>
    <line x1="140" y1="248" x2="372" y2="248"/>
    <line x1="140" y1="288" x2="372" y2="288"/>
    <line x1="140" y1="328" x2="372" y2="328"/>
    <line x1="140" y1="368" x2="372" y2="368"/>
  </g>

  <!-- Month/Year indicator -->
  <text x="256" y="388" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="18" font-weight="500" fill="#fbbf24" opacity="0.8">JUNE 1988</text>

  <!-- Accent mark at top right (like a bookmark) -->
  <path d="M400 96 L448 96 L424 128 Z" fill="url(#goldGradient)" opacity="0.9" filter="url(#shadow)"/>

  <!-- Small decorative elements - historical markers -->
  <circle cx="72" cy="100" r="4" fill="#d97706" opacity="0.6"/>
  <circle cx="440" cy="100" r="4" fill="#d97706" opacity="0.6"/>
  <circle cx="72" cy="412" r="4" fill="#d97706" opacity="0.6"/>
  <circle cx="440" cy="412" r="4" fill="#d97706" opacity="0.6"/>
</svg>