name: Deploy to GitHub Pages

on:
  # Deploy only after the CI quality gate has passed on the canonical branch.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'deploy-pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # `workflow_run` fires for any conclusion; only deploy on CI success.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # .env.production is committed to the repo and already contains the real
      # Firebase keys (public Vite SPA — keys are visible in the built JS anyway).
      # We do NOT overwrite it here; Vite picks it up automatically during build.

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Copy CNAME to dist
        run: cp CNAME dist/CNAME

      # public/404.html is the proper SPA redirect page (already in public/,
      # Vite copies it to dist/404.html automatically — no manual cp needed)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          cname: mounir1.github.io
