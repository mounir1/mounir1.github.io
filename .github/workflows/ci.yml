name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS: Node 20 cannot boot the vitest workers — jsdom pulls in
          # undici, which calls webidl.util.markAsUncloneable (Node 22+ only).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      # Catches the specific footgun that silently deleted this workflow: an
      # unquoted `run:` value containing ": " (e.g. `run: echo "a: b"`) parses
      # as a YAML mapping, so the workflow is never scheduled and CI shows
      # nothing at all. It is valid YAML, so a plain YAML parse will NOT catch
      # it — `run` must be a string. Same trap applies to `env:`, `name:` etc.
      - name: Guard workflow run/env values against YAML mapping coercion
        run: node scripts/check-workflow-yaml.mjs

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
