version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Algiers
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint"]
      types:
        patterns: ["@types/*"]
    ignore:
      # Major version bumps of the framework/core must be reviewed manually.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # tailwind-merge v3 drops Tailwind CSS v3 support (its release notes are
      # explicit: "you should upgrade to Tailwind CSS v4 and tailwind-merge v3
      # together"). We are on tailwindcss ^3.4, so a v3 bump must be paired with
      # a deliberate Tailwind v4 migration — never an unattended Dependabot PR.
      # `cn()` in src/lib/utils.ts drives every shadcn/ui class override, and no
      # test asserts merge behaviour, so CI would not catch a silent regression.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # Same coupling in the other direction: Tailwind v4 majors require the
      # tailwind-merge v3 bump above in the same change.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
      include: scope
