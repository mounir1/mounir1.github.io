    <!-- GitHub Pages SPA routing: restore path after 404.html redirect -->
    <script>
      (function () {
        var r = sessionStorage.getItem('spa_redirect');
        if (r) {
          sessionStorage.removeItem('spa_redirect');
          try {
            var d = JSON.parse(r);
            if (d.path && d.path !== '/') {
              window.history.replaceState(null, '', d.path + (d.query || '') + (d.hash || ''));
            }
          } catch (e) {}
        }
      })();
    </script>
